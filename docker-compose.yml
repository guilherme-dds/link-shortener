version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend

    ports:
      - "3333:3333"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/src
      - /node_modules
